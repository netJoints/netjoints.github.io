# Jekyll Configuration for GitHub Pages
# Site settings
title: Network Joints
description: Cloud Networking, Security, and Infrastructure Insights - Joining networks together!
author: Shahzad Ali
url: "https://netjoints.github.io"
baseurl: ""

# Build settings
markdown: kramdown
theme: minima

# Permalink structure (WordPress-style)
permalink: /:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - migrate.sh
  - wordpress_to_github.py
  - requirements.txt
  - fix_dates.py

# Include
include:
  - _posts

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Shahzad Ali"
      comments: false

# Social links
github_username: netJoints
# twitter_username: yourusername

# Show excerpts on homepage
show_excerpts: true

# Pagination (if using jekyll-paginate)
# paginate: 10
# paginate_path: "/page/:num/"
