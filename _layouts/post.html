---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    {% if page.author %} • {{ page.author }}{% endif %}
  </p>
  
  <hr>
  
  {{ content }}
  
  <hr>
  
  <p><a href="{{ "/blog" | relative_url }}">← Back to Blog</a></p>
</article>
